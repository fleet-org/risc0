# The CUDA arm's DEVICE module (GROTH16 s01/4): `#[kernel]` wrappers around the per-index bodies of
# risc0-groth16-oxide, compiled by NVlabs/cuda-oxide (`cargo oxide build`) to PTX. Not a workspace
# member — it needs cuda-oxide's nightly and its rustc backend — and never compiled by this repo's CI.
# See README.md in this directory.
[package]
name = "risc0-groth16-cuda-kernels"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
risc0-groth16-core = { path = "../../risc0/groth16-core", default-features = false }
risc0-groth16-oxide = { path = "../../risc0/groth16-oxide", default-features = false }
# UNVERIFIED (no CUDA host in the authoring session): crate names and the attribute paths below are
# those of the pinned cuda-oxide tree (groth16_s01/CUDA_OXIDE_PIN.md); confirm against its examples.
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide", rev = "6abfaa091e29a6275c1943895bfbc97efa306e98" }
cuda-macros = { git = "https://github.com/NVlabs/cuda-oxide", rev = "6abfaa091e29a6275c1943895bfbc97efa306e98" }

[profile.release]
opt-level = 3
panic = "abort"
