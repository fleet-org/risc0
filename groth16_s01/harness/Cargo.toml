[package]
name = "groth16-s01-harness"
description = "GROTH16 s01/5: the differential harness (derive, run a backend, upstream oracle)"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
publish = false

[[bin]]
name = "groth16-s01-harness"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bincode = "1.3"
circom-witnesscalc = "0.2.1"
hex = "0.4"
risc0-binfmt = { workspace = true }
risc0-groth16 = { workspace = true, features = ["prove"] }
risc0-groth16-core = { path = "../../risc0/groth16-core" }
risc0-groth16-sys = { workspace = true, features = ["reference", "oxide-cpu"] }
risc0-zkos-v1compat = { workspace = true }
risc0-zkvm = { workspace = true, features = ["prove"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"

[features]
default = []
# Make the canonical CUDA backend available to the harness (needs nvcc + a CUDA host).
cuda = ["risc0-groth16-sys/cuda", "risc0-zkvm/cuda"]
# The canonical CUDA kernels alone (nvcc-built sppark + risc0 kernels), for `--control canonical`
# without the zkVM's CUDA HAL: the derive step stays on the CPU prover.
cuda-canonical = ["risc0-groth16-sys/cuda"]
# The CUDA arm (needs the CUDA 13 headers to build, a driver + the device module to run).
cuda-oxide = ["risc0-groth16-sys/cuda-oxide"]
# The Metal arm (macOS on Apple Silicon only; elsewhere the kind is unavailable).
metal = ["risc0-groth16-sys/metal"]
# The Metal shaders on the CPU (every target but macOS): the production circuit through the exact
# shader source, verified by the upstream oracle.
metal-cpu = ["risc0-groth16-sys/metal-cpu"]
