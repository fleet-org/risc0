# TOML formatting for the milestone's manifests. Key ORDER belongs to cargo-sort (the gate runs it);
# taplo only lays out what is there.
[formatting]
align_entries = false
align_comments = true
array_auto_collapse = false
array_auto_expand = true
column_width = 100
indent_string = "  "
reorder_keys = false
reorder_arrays = false
