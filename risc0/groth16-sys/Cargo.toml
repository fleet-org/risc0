[package]
name = "risc0-groth16-sys"
description = "C++ code for groth16 proof generation"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
links = "risc0-groth16-sys"

[build-dependencies]
risc0-build-kernel = { workspace = true }

[dependencies]
anyhow = "1.0.98"
blst = { version = "0.3.15", optional = true }
getrandom = { version = "0.2", optional = true }
risc0-groth16-core = { path = "../groth16-core", optional = true }
risc0-groth16-cuda = { path = "../groth16-cuda", optional = true }
risc0-groth16-metal = { path = "../groth16-metal", optional = true }
risc0-groth16-oxide = { path = "../groth16-oxide", optional = true }
sppark = { workspace = true, optional = true }

[dev-dependencies]
risc0-groth16 = { workspace = true }
serde_json = "1.0"
tempfile = "3"
test-log = { version = "0.2.17", default-features = false, features = [
  "trace",
] }
tracing = "0.1.41"

[features]
default = []
cuda = ["dep:blst", "dep:sppark"]
# The Metal arm (s01/4b): available only on macOS/aarch64 builds; the feature exists everywhere so a
# selection of `metal` elsewhere is an explicit "unavailable", never a silent fallback.
metal = ["dep:risc0-groth16-core", "dep:getrandom", "dep:risc0-groth16-metal"]
# The Metal arm's shaders compiled as C++ and run on the CPU (every target but macOS): the exact
# shader source through the boundary and the harness; a testing kind like `oxide-cpu`.
metal-cpu = ["dep:risc0-groth16-core", "dep:getrandom", "dep:risc0-groth16-metal"]
# CPU reference prover behind the same boundary: for tests and the differential harness,
# never the default, not a production path (GROTH16 s01, DEF-G16-006).
reference = ["dep:risc0-groth16-core", "dep:getrandom"]
# The CUDA arm's kernel bodies run by the host launcher: proves the exact kernel code on a
# CPU through the same boundary; a testing kind like `reference`, never the default.
oxide-cpu = ["dep:risc0-groth16-oxide", "dep:risc0-groth16-core", "dep:getrandom"]
# The CUDA arm (s01/4): the cuda-oxide device module launched through cuda-core. Builds without a
# GPU (CUDA headers only); runs only where a CUDA 13 driver and the device module exist.
cuda-oxide = ["dep:risc0-groth16-cuda", "dep:risc0-groth16-core", "dep:getrandom"]
setup = []
