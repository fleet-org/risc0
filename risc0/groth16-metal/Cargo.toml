[package]
name = "risc0-groth16-metal"
description = "GROTH16 s01/4b: the Metal arm (MSL kernels mirroring the oxide bodies)"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
publish = false

[[bin]]
name = "groth16-metal-kernel-check"
path = "src/bin/kernel-check.rs"

[dependencies]
anyhow = "1.0"
risc0-groth16-core = { path = "../groth16-core" }
# the launch schedule of the coset transform (shared with the CUDA arm and the CPU pipeline)
risc0-groth16-oxide = { path = "../groth16-oxide" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
metal = { workspace = true }

[dev-dependencies]
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
