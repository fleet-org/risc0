# GROTH16 s01 — milestone CI for the fleet-org/risc0 fork (fleet-org/risc0 milestone 1).
#
# Gates the boundary crate on every change to it, on the branch the milestone
# integrates into. Arms add their own jobs here as they land: the CUDA arm needs
# a CUDA-capable runner, the Metal arm a macOS runner — neither exists on
# ubuntu-latest, which is why this job type-checks those paths without building
# kernels (RISC0_SKIP_BUILD_KERNELS) or an SDK (cargo check for the darwin target).
name: groth16-s01

on:
  push:
    branches: [integration/staging-platform]
    paths:
      - 'risc0/groth16-core/**'
      - 'risc0/groth16-cuda/**'
      - 'risc0/groth16-metal/**'
      - 'risc0/groth16-oxide/**'
      - 'risc0/groth16-sys/**'
      - 'risc0/groth16/**'
      - 'groth16_s01/harness/**'
      - '.github/workflows/groth16-s01.yml'
  pull_request:
    branches: [integration/staging-platform]
    paths:
      - 'risc0/groth16-core/**'
      - 'risc0/groth16-cuda/**'
      - 'risc0/groth16-metal/**'
      - 'risc0/groth16-oxide/**'
      - 'risc0/groth16-sys/**'
      - 'risc0/groth16/**'
      - 'groth16_s01/harness/**'
      - '.github/workflows/groth16-s01.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: risc0-groth16-sys boundary (host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin
      - name: Shared arithmetic + formats + reference prover (risc0-groth16-core, vs arkworks)
        run: cargo test -p risc0-groth16-core --locked
      - name: no_std build of the shared crate (what the cuda-oxide kernels compile)
        run: cargo check -p risc0-groth16-core --no-default-features --locked
      - name: Unit tests — selection and dispatch properties (default features)
        run: cargo test -p risc0-groth16-sys --locked
      - name: Reference backend through the boundary, verified by risc0-groth16's verifier
        run: cargo test -p risc0-groth16-sys --features reference --locked
      - name: CUDA arm kernel bodies on the CPU launcher (byte-identical proof to the reference; no_std build)
        run: |
          cargo test -p risc0-groth16-oxide --locked
          cargo check -p risc0-groth16-oxide --no-default-features --locked
          cargo test -p risc0-groth16-sys --features reference,oxide-cpu --locked
      - name: Metal arm host side (record layouts, shader source) and its darwin type-check
        run: |
          cargo test -p risc0-groth16-metal --locked
          cargo check -p risc0-groth16-metal --target aarch64-apple-darwin --locked
      - name: CUDA 13 headers without a toolkit (rootless; what cuda-bindings needs to build)
        run: groth16_s01/scripts/cuda-headers.sh "$RUNNER_TEMP/cuda" >> "$GITHUB_ENV"
      - name: CUDA arm host side (risc0-groth16-cuda) and the cuda-oxide backend behind the boundary — type-check, no GPU
        run: |
          cargo check -p risc0-groth16-cuda --all-targets --locked
          cargo check -p risc0-groth16-sys --features cuda-oxide --locked
      - name: Type-check the canonical CUDA path without nvcc
        env:
          RISC0_SKIP_BUILD_KERNELS: "1"
        run: cargo check -p risc0-groth16-sys --features cuda --locked
      - name: Type-check for aarch64-apple-darwin (Metal arm target; no SDK needed for check)
        run: |
          cargo check -p risc0-groth16-sys -p risc0-groth16-core -p risc0-groth16-oxide --target aarch64-apple-darwin --locked
          cargo check -p risc0-groth16-sys --features metal --target aarch64-apple-darwin --locked

  harness:
    name: s01/5 harness compiles (CPU prover + reference arm)
    # Post-merge record only: a 30-minute compile that the owning session runs locally before every
    # merge (DEF-G16-011). A PR is gated by the boundary job and the hygiene workflow.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml) + protoc for circom-witnesscalc's build script
        run: |
          rustup show active-toolchain
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libclang-dev
          protoc --version
      - name: Type-check the harness (pulls the CPU recursion prover; no artifacts needed to compile)
        run: cargo check -p groth16-s01-harness --locked
